<!doctype html>
<html lang="ro" translate="no">
<head>
<meta charset="utf-8">

<title>e-Raport România · Demo București</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--card:#141821;--card2:#111722;--line:rgba(255,255,255,.09);--text:#f7f8fb;--muted:#8e98aa;--blue:#2f80ff;--blue2:#56a2ff;--yellow:#f4bf35;--green:#18b981;--red:#ef4444;--shadow:0 25px 80px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:#333;color:var(--text)}body{min-height:100vh}.stage{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px 60px;background:radial-gradient(circle at 50% -20%,#192337 0,#343434 42%,#343434 100%)}
.phone{width:min(100%,430px);min-height:820px;background:var(--bg);border-radius:0;overflow:hidden;position:relative;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.04)}
@media(min-width:700px){.phone{border-radius:30px;margin-top:8px;border:8px solid #1f232b}}
.app{min-height:804px;padding:24px 16px 32px;position:relative}.demo-ribbon{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;padding:9px 12px;border-radius:16px;background:rgba(239,68,68,.13);border:1px solid rgba(239,68,68,.25);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fecaca}.demo-ribbon button{border:0;background:transparent;color:#fff;cursor:pointer;font:inherit;letter-spacing:0;text-transform:none}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back{appearance:none;border:0;background:transparent;color:#aeb8c8;font:600 14px Inter;cursor:pointer;padding:6px 0}.id{font-size:12px;color:#707b8e;text-align:right}.progress-card,.card{border-radius:28px;border:1px solid var(--line);background:rgba(20,24,33,.92);box-shadow:0 18px 50px rgba(0,0,0,.18)}.progress-card{padding:16px;margin-bottom:18px}.bartrack{height:7px;border-radius:99px;background:#242b37;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:99px;transition:width .35s ease}.progress-meta{display:flex;justify-content:space-between;margin-top:12px;font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:#687487}.screen{animation:in .22s ease}@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}h1{font-size:30px;line-height:1.06;margin:0 0 8px;letter-spacing:-.04em}h2{font-size:21px;margin:0 0 12px;letter-spacing:-.025em}.subtitle{font-size:14px;line-height:1.55;color:#94a0b2;margin:0 0 18px}.card{padding:18px;margin:14px 0}.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.19em;color:#6e7a8d;margin:0 0 10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:block;margin:12px 0}.field label{display:block;font-size:13px;color:#a6b0c0;margin:0 0 7px}.input,.select{width:100%;min-height:50px;border-radius:16px;border:2px solid rgba(47,128,255,.30);background:#151b25;color:#fff;padding:13px 14px;font:500 15px Inter;outline:none;transition:.18s}.input.yellow{border-color:rgba(244,191,53,.35)}.input.filling{border-color:rgba(86,162,255,.9);box-shadow:0 0 0 3px rgba(47,128,255,.10)}.input[readonly]{cursor:default}.btn{width:100%;border:0;border-radius:23px;padding:15px 18px;font:700 16px Inter;text-align:left;color:#fff;background:var(--blue);cursor:pointer;box-shadow:0 12px 32px rgba(47,128,255,.25);transition:.15s}.btn:active{transform:scale(.99)}.btn.secondary{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line);color:#f2f5fa}.btn.success{background:var(--green)}.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice button,.pill{border:1px solid var(--line);border-radius:17px;background:#151a23;color:#9aa6b8;padding:12px 10px;font:600 14px Inter;text-align:center}.choice button.on{background:rgba(47,128,255,.16);border-color:rgba(47,128,255,.55);color:#dbeaff}.warn{padding:12px 14px;border-radius:17px;border:1px solid rgba(245,158,11,.24);background:rgba(245,158,11,.08);color:#fde6a9;font-size:13px;line-height:1.45}.ok{padding:12px 14px;border-radius:17px;border:1px solid rgba(24,185,129,.25);background:rgba(24,185,129,.10);color:#c8f7e6;font-size:13px;line-height:1.45}.map{height:170px;border-radius:22px;overflow:hidden;position:relative;background:#e8ebef;border:1px solid rgba(255,255,255,.08);margin-top:12px}.map:before,.map:after{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(25deg,transparent 0 28px,#cfd5dc 29px 34px,transparent 35px 68px)}.map:after{transform:rotate(80deg);opacity:.7}.road{position:absolute;left:-5%;right:-5%;top:72px;height:32px;background:#c0c7cf;transform:rotate(-7deg);z-index:2}.pin{position:absolute;left:52%;top:50%;width:22px;height:22px;border-radius:50% 50% 50% 0;background:#e53935;transform:translate(-50%,-50%) rotate(-45deg);z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.3)}.pin:after{content:"";width:8px;height:8px;background:white;border-radius:50%;position:absolute;left:7px;top:7px}.maplabel{position:absolute;left:12px;right:12px;bottom:10px;z-index:6;background:rgba(255,255,255,.92);color:#26303b;padding:9px 11px;border-radius:12px;font-size:11px;font-weight:700}.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0d1118;position:relative;min-height:108px}.photo img{width:100%;height:100%;aspect-ratio:1.35;object-fit:cover;display:block}.photo span{position:absolute;left:8px;bottom:8px;background:rgba(3,8,15,.82);padding:5px 7px;border-radius:9px;font-size:10px;font-weight:700}.document{overflow:hidden;border-radius:20px;border:1px solid var(--line);background:white}.document img{display:block;width:100%}.checks{display:grid;gap:9px}.check{display:flex;align-items:center;gap:10px;background:#151a23;border:1px solid var(--line);border-radius:16px;padding:12px 13px;color:#c8d0dc;font-size:13px}.box{width:21px;height:21px;border-radius:6px;border:2px solid #566174;display:grid;place-items:center;font-weight:900}.check.on .box{background:var(--blue);border-color:var(--blue)}.check.on .box:after{content:"✓";font-size:14px}.sketch{border-radius:22px;overflow:hidden;background:white;border:1px solid var(--line)}.sketch img{width:100%;display:block}.qr{width:210px;height:210px;margin:12px auto;border:13px solid white;border-radius:16px;background-color:white;background-image:linear-gradient(90deg,#111 11px,transparent 11px),linear-gradient(#111 11px,transparent 11px);background-size:29px 29px;position:relative}.qr:before,.qr:after{content:"";position:absolute;width:52px;height:52px;border:10px solid #111;background:white}.qr:before{left:4px;top:4px}.qr:after{right:4px;bottom:4px}.summary{display:grid;gap:10px}.summary-row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px}.summary-row span:first-child{color:#7f8a9c}.summary-row span:last-child{text-align:right;color:#f5f7fb;font-weight:600}.sig{height:120px;border-radius:20px;background:#fff;color:#18304d;display:flex;align-items:center;justify-content:center;font-family:"Brush Script MT",cursive;font-size:34px;transform:rotate(-3deg);margin-top:8px;position:relative}.sig:after{content:"DEMO";position:absolute;right:9px;bottom:8px;font:800 9px Inter;color:#e53935;letter-spacing:.14em}.pdf-card{background:#f8fafc;color:#122033;border-radius:22px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.pdf-head{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #d9dee6;padding-bottom:12px;margin-bottom:12px}.pdf-title{font-size:18px;font-weight:800}.pdf-demo{font-size:10px;font-weight:900;color:#c62828}.pdf-lines{display:grid;gap:8px}.pdf-line{height:8px;border-radius:9px;background:#d7dde6}.pdf-line:nth-child(2){width:78%}.pdf-line:nth-child(3){width:90%}.pdf-line:nth-child(4){width:65%}.splash{min-height:700px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.brandmark{width:110px;height:78px;overflow:hidden;position:relative}.brandmark img{position:absolute;width:120px;height:120px;left:50%;top:0;transform:translateX(-50%)}.brandname{font-size:38px;font-weight:700;letter-spacing:-.05em;margin-top:7px}.brandname .e{color:var(--blue)}.by{margin-top:8px;color:#7c8798;font-size:12px;text-transform:uppercase;letter-spacing:.25em}.home-actions{display:grid;gap:12px;margin-top:24px}.demo-note{font-size:12px;color:#7f8a9c;line-height:1.5;text-align:center;margin-top:18px}.typing-dot{display:inline-block;width:5px;height:14px;background:#69a9ff;margin-left:3px;vertical-align:-2px;animation:blink .75s steps(1) infinite}@keyframes blink{50%{opacity:0}}.hide{display:none!important}.footer-controls{display:flex;gap:8px;margin-top:14px}.footer-controls button{flex:1;border-radius:16px;border:1px solid var(--line);background:#151a23;color:#9aa6b8;padding:10px;font:600 12px Inter;cursor:pointer}.footer-controls button.active{color:#dbeaff;border-color:rgba(47,128,255,.5);background:rgba(47,128,255,.12)}
</style>
</head>
<body>
<div class="stage"><main class="phone"><div class="app" id="app"></div></main></div>
<script>
const A='demo-assets/';
const steps=[
 {key:'safety',title:'Siguranța la locul accidentului',sub:'Mai întâi verificăm dacă formularul amiabil poate fi folosit.',kind:'safety'},
 {key:'place',title:'Data, ora și locul accidentului',sub:'Coordonatele GPS și adresa sunt asociate raportului.',kind:'place'},
 {key:'docs',title:'Documentație',sub:'Fotografii ale situației și documentele celor două vehicule.',kind:'docs'},
 {key:'driverA',title:'Conducător A',sub:'Datele persoanei care conduce vehiculul A.',kind:'form',accent:'blue',fields:[['Nume','Popescu'],['Prenume','Andrei'],['Data nașterii','14.03.1987'],['Adresă','Str. Valea Lungă 18'],['Oraș','București'],['Telefon','0722 555 101'],['E-mail','andrei.popescu@demo.ro'],['Permis de conducere','B12345678']]},
 {key:'vehicleA',title:'Vehicul A',sub:'Datele vehiculului albastru.',kind:'form',accent:'blue',fields:[['Număr de înmatriculare','B 123 RMC'],['Țară','România'],['Marcă','Dacia'],['Model','Logan'],['Tip vehicul','Autoturism'],['VIN','UU1LSDABCD1234567']]},
 {key:'policyA',title:'RCA A',sub:'Polița de răspundere civilă pentru vehiculul A.',kind:'form',accent:'blue',fields:[['Asigurător','OMNIASIG Vienna Insurance Group'],['Număr poliță','RO/RCA/A/102938'],['Valabil de la','12.02.2026'],['Valabil până la','11.02.2027'],['Sucursala','București Sector 6']]},
 {key:'circ',title:'Împrejurările accidentului',sub:'Se marchează situațiile relevante pentru fiecare vehicul.',kind:'circ'},
 {key:'sketch',title:'Schița accidentului',sub:'Poziția vehiculelor și punctul inițial de contact.',kind:'sketch'},
 {key:'invite',title:'Al doilea participant',sub:'Participantul B poate completa datele pe propriul telefon.',kind:'invite'},
 {key:'import',title:'Date participant B',sub:'Datele participantului B sunt preluate în raport.',kind:'import'},
 {key:'driverB',title:'Conducător B',sub:'Datele persoanei care conduce vehiculul B.',kind:'form',accent:'yellow',fields:[['Nume','Ionescu'],['Prenume','Mihai'],['Data nașterii','09.11.1984'],['Adresă','Str. Apusului 42'],['Oraș','București'],['Telefon','0733 555 202'],['E-mail','mihai.ionescu@demo.ro'],['Permis de conducere','B87654321']]},
 {key:'vehicleB',title:'Vehicul B',sub:'Datele vehiculului galben.',kind:'form',accent:'yellow',fields:[['Număr de înmatriculare','B 456 DEM'],['Țară','România'],['Marcă','Škoda'],['Model','Octavia'],['Tip vehicul','Autoturism'],['VIN','TMBDEMOBCD7654321']]},
 {key:'policyB',title:'RCA B',sub:'Polița de răspundere civilă pentru vehiculul B.',kind:'form',accent:'yellow',fields:[['Asigurător','Allianz-Țiriac Asigurări'],['Număr poliță','RO/RCA/B/564738'],['Valabil de la','20.06.2026'],['Valabil până la','19.06.2027'],['Sucursala','București']]},
 {key:'review',title:'Previzualizare raport',sub:'Datele ambilor participanți sunt reunite înainte de semnare.',kind:'review'},
 {key:'sign',title:'Semnături A și B',sub:'Fiecare conducător confirmă datele introduse.',kind:'sign'},
 {key:'final',title:'Raport finalizat',sub:'Documentația este pregătită pentru descărcare și transmitere.',kind:'final'}
];
let current=-2, autoplay=false, timer=null, fillTimers=[];
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function clearFill(){fillTimers.forEach(clearTimeout);fillTimers=[]}
function brand(){return `<div class="brandmark"><img src="logo.png" alt=""></div><div class="brandname"><span class="e">e</span>-Raport</div><div class="by">by AutoPulse</div>`}
function ribbon(){return `<div class="demo-ribbon"><span>DEMO BUCUREȘTI · FĂRĂ VALOARE JURIDICĂ</span><button onclick="location.href='index.html'">Pagina principală</button></div>`}
function progress(){let i=current+1;return `<div class="progress-card"><div class="bartrack"><div class="bar" style="width:${(i/steps.length)*100}%"></div></div><div class="progress-meta"><span>${i}/${steps.length}</span><span>RO-DEMO-001</span></div></div>`}
function shell(inner){return `${ribbon()}<div class="header"><button class="back" onclick="prev()">Înapoi</button><div class="id">RO-DEMO-001<br><span style="color:#4f5b6d">01.10.2026 · 17:42</span></div></div>${progress()}<div class="screen">${inner}</div><div class="footer-controls"><button class="${autoplay?'active':''}" onclick="toggleAuto()">${autoplay?'■ Oprește auto':'▶ Auto demo'}</button><button onclick="restart()">↺ Repornește</button></div>`}
function input(label,value,accent='blue',idx=0){return `<div class="field"><label>${label}</label><input class="input ${accent==='yellow'?'yellow':''}" readonly data-fill="${esc(value)}" data-delay="${idx}" value=""></div>`}
function form(s){return `<h1>${s.title}</h1><p class="subtitle">${s.sub}</p><div class="card"><div class="section-label">Date demonstrative</div>${s.fields.map((f,i)=>input(f[0],f[1],s.accent,i)).join('')}</div>${nav()}`}
function nav(){return `<button class="btn" onclick="next()">Continuă</button>`}
function renderStep(s){
 let x=`<h1>${s.title}</h1><p class="subtitle">${s.sub}</p>`;
 if(s.kind==='safety') x+=`<div class="card"><div class="field"><label>Există persoane rănite?</label><div class="choice"><button class="on">Nu</button><button>Da</button></div></div><div class="field"><label>Pagube la alte vehicule?</label><div class="choice"><button class="on">Nu</button><button>Da</button></div></div><div class="field"><label>Pagube la alte obiecte?</label><div class="choice"><button class="on">Nu</button><button>Da</button></div></div></div><div class="ok">✓ Cazul poate fi documentat prin constatare amiabilă.</div>${nav()}`;
 if(s.kind==='place') x+=`<div class="card">${input('Data','01.10.2026','blue',0)}${input('Ora','17:42','blue',1)}${input('Stradă','Bulevardul Iuliu Maniu','blue',2)}${input('Număr','19','blue',3)}${input('Oraș','București','blue',4)}<button class="btn secondary" style="margin-top:6px">⌖ Locație GPS preluată</button><div class="map"><div class="road"></div><div class="pin"></div><div class="maplabel">Bulevardul Iuliu Maniu 19 · Sector 6 · București</div></div></div>${nav()}`;
 if(s.kind==='docs') x+=`<div class="card"><div class="section-label">Fotografii accident</div><div class="photos"><div class="photo"><img src="${A}scene-contact.jpg"><span>Poziția vehiculelor</span></div><div class="photo"><img src="${A}scene-overview.jpg"><span>Fotografie de ansamblu</span></div><div class="photo"><img src="${A}damage-a.jpg"><span>Avarie vehicul A</span></div><div class="photo"><img src="${A}damage-b.jpg"><span>Avarie vehicul B</span></div></div></div><div class="card"><div class="section-label">Certificate de înmatriculare</div><div class="photos"><div class="photo"><img src="${A}doc-a-front.jpg"><span>A · față</span></div><div class="photo"><img src="${A}doc-b-front.jpg"><span>B · față</span></div></div></div>${nav()}`;
 if(s.kind==='form') x+=form(s).replace(`<h1>${s.title}</h1><p class="subtitle">${s.sub}</p>`,'');
 if(s.kind==='circ') x+=`<div class="card"><div class="section-label">Vehicul A</div><div class="checks"><div class="check on"><span class="box"></span>Circula pe banda sa</div><div class="check"><span class="box"></span>Schimba banda</div></div></div><div class="card"><div class="section-label">Vehicul B</div><div class="checks"><div class="check on"><span class="box"></span>Schimba banda spre stânga</div><div class="check on"><span class="box"></span>Intra în contact lateral</div></div>${input('Observație B','Am schimbat banda spre stânga și am atins lateral vehiculul A.','yellow',0)}</div>${nav()}`;
 if(s.kind==='sketch') x+=`<div class="card"><div class="sketch"><img src="${A}sketch.png" alt="Schița accidentului"></div><div class="ok" style="margin-top:12px">✓ Punctul inițial de impact și direcțiile de deplasare sunt marcate.</div></div><button class="btn secondary" style="margin-bottom:10px">Confirmă schița</button>${nav()}`;
 if(s.kind==='invite') x+=`<div class="card" style="text-align:center"><div class="section-label">Transfer date participant B</div><img src="demo-assets/qr-participant-b.png" alt="QR demo participant B" style="display:block;width:100%;max-width:360px;height:auto;margin:12px auto;border-radius:16px;background:#fff"><p class="subtitle" style="margin:8px 0 0">Participantul B scanează codul și completează datele pe propriul telefon.</p></div><button class="btn secondary" style="margin-bottom:10px">Simulează scanarea QR</button>${nav()}`;
 if(s.kind==='import') x+=`<div class="ok">✓ Datele participantului B au fost adăugate cu succes.</div><div class="card"><div class="summary"><div class="summary-row"><span>Conducător</span><span>Mihai Ionescu</span></div><div class="summary-row"><span>Vehicul</span><span>Škoda Octavia</span></div><div class="summary-row"><span>Număr</span><span>B 456 DEM</span></div><div class="summary-row"><span>Sursă</span><span>QR · telefon participant B</span></div></div></div>${nav()}`;
 if(s.kind==='review') x+=`<div class="card"><div class="section-label">Accident</div><div class="summary"><div class="summary-row"><span>Loc</span><span>Bd. Iuliu Maniu 19</span></div><div class="summary-row"><span>Data / ora</span><span>01.10.2026 · 17:42</span></div><div class="summary-row"><span>Răniți</span><span>Nu</span></div></div></div><div class="card"><div class="section-label">Vehicule</div><div class="summary"><div class="summary-row"><span>A</span><span>Dacia Logan · B 123 RMC</span></div><div class="summary-row"><span>B</span><span>Škoda Octavia · B 456 DEM</span></div><div class="summary-row"><span>Fotografii</span><span>4</span></div><div class="summary-row"><span>Schiță</span><span>Confirmată</span></div></div></div>${nav()}`;
 if(s.kind==='sign') x+=`<div class="card"><div class="section-label">Semnătura conducătorului A</div><div class="sig">Andrei Popescu</div></div><div class="card"><div class="section-label">Semnătura conducătorului B</div><div class="sig" style="transform:rotate(2deg)">Mihai Ionescu</div></div><button class="btn success" onclick="next()">Salvează ambele semnături</button>`;
 if(s.kind==='final') x+=`<div class="ok">✓ e-Raport este finalizat și blocat pentru editare.</div><div class="card"><div class="pdf-card"><div class="pdf-head"><div><div class="pdf-title">Constatare amiabilă</div><div style="font-size:11px;color:#607086;margin-top:3px">RO-DEMO-001 · București</div></div><div class="pdf-demo">DEMO</div></div><div class="pdf-lines"><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div><div class="pdf-line"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px"><div style="height:52px;border:1px solid #d8dee8;border-radius:12px"></div><div style="height:52px;border:1px solid #d8dee8;border-radius:12px"></div></div></div></div><a class="btn" style="display:block;text-decoration:none;margin-bottom:10px" href="app/demo/RO-DEMO-001.pdf" target="_blank">Deschide PDF-ul demo</a><a class="btn secondary" style="display:block;text-decoration:none" href="app/#/">Deschide aplicația e-Raport</a>`;
 return shell(x)
}
function render(){clearFill();
 if(current===-2){app.innerHTML=`${ribbon()}<div class="splash">${brand()}<div class="demo-note">Simulare de prezentare · București</div></div>`;timer=setTimeout(()=>{current=-1;render()},1100);return}
 if(current===-1){app.innerHTML=`${ribbon()}<div class="splash">${brand()}<h1 style="margin-top:34px">Demo București</h1><p class="subtitle" style="max-width:330px">Accident fictiv între două vehicule, fără persoane rănite. Demonstrația reproduce fluxul aplicației e-Raport, ecran cu ecran.</p><div class="home-actions" style="width:100%;max-width:340px"><button class="btn" onclick="start()">Pornește demonstrația</button><a class="btn secondary" style="text-decoration:none" href="app/#/">Deschide aplicația reală</a></div><div class="demo-note">Toate numele, documentele, polițele și numerele sunt fictive.</div></div>`;return}
 app.innerHTML=renderStep(steps[current]); animate(); }
function animate(){
 const els=[...document.querySelectorAll('[data-fill]')]; els.forEach((el,i)=>{const value=el.dataset.fill||''; el.value=''; const start=setTimeout(()=>{el.classList.add('filling'); let n=0; const iv=setInterval(()=>{n=Math.min(value.length,n+Math.max(1,Math.ceil(value.length/18))); el.value=value.slice(0,n); if(n>=value.length){clearInterval(iv);el.classList.remove('filling')}},25)},i*150);fillTimers.push(start)});
 if(autoplay){const wait=1700+els.length*150;timer=setTimeout(()=>next(),Math.min(4200,wait))}
}
function start(){current=0;render()}
function next(){clearTimeout(timer);if(current<steps.length-1){current++;render()}else restart()}
function prev(){clearTimeout(timer);if(current>0){current--;render()}else if(current===0){current=-1;render()}else location.href='index.html'}
function restart(){clearTimeout(timer);current=-1;autoplay=false;render()}
function toggleAuto(){autoplay=!autoplay;render();if(autoplay&&current===-1){start()}}
render();
</script>
</body></html>
