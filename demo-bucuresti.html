<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo București - e-Izveštaj</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#f6f8fb;background:#07111f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#173b73,transparent 35%),#07111f}.wrap{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.badge{background:#b91c1c;padding:8px 13px;border-radius:999px;font-weight:900;font-size:13px}.layout{display:grid;grid-template-columns:280px 1fr;gap:22px;margin-top:24px}.steps,.phone{background:#0e1b2d;border:1px solid #24344c;border-radius:28px;padding:20px}.step{padding:14px;border-radius:16px;color:#91a1b8;margin:7px 0}.step.active{background:#17355f;color:white}.phone{min-height:650px}.screen{max-width:560px;margin:auto;background:#0a101b;border:1px solid #30415a;border-radius:26px;padding:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{background:#121e2f;border:1px solid #2d405a;border-radius:14px;padding:12px;margin:9px 0}.label{font-size:12px;color:#8fa1ba;text-transform:uppercase;letter-spacing:.08em}.value{font-size:16px;margin-top:5px;min-height:20px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button,a.btn{border:0;border-radius:999px;padding:12px 17px;font-weight:850;text-decoration:none;background:#2477ff;color:#fff;cursor:pointer}.secondary{background:#17263b!important}.note{color:#aeb9c8;line-height:1.5}.progress{height:7px;background:#1b2a3d;border-radius:99px;overflow:hidden}.bar{height:100%;background:#2477ff;width:12.5%;transition:.4s}@media(max-width:800px){.layout{grid-template-columns:1fr}.steps{display:none}.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><div class="badge">DEMO · FĂRĂ VALOARE JURIDICĂ</div><h1>Simulare reală de completare - București</h1><p class="note">Accident fictiv, două vehicule, fără victime. Demonstrația reproduce pașii aplicației și datele care apar în raportul RO-DEMO-001.</p></div><a class="btn secondary" href="index.html">Pagina principală</a></div><div class="layout"><div class="steps" id="steps"></div><div class="phone"><div class="progress"><div class="bar" id="bar"></div></div><div class="screen" id="screen"></div><div class="actions"><button onclick="prev()">Înapoi</button><button onclick="next()">Pasul următor</button><button class="secondary" onclick="play()">Redă automat</button><a class="btn secondary" href="app/">Deschide aplicația reală</a></div></div></div></div><script>
const data=[
['Siguranță și loc','01.10.2026 · 17:42','Bulevardul Iuliu Maniu 19','București, România','Fără persoane rănite','Fără alte bunuri avariate'],
['Documentație','4 fotografii ale accidentului','Certificat înmatriculare A - față/verso','Certificat înmatriculare B - față/verso','GPS: 44.4348, 26.0408','Martor: Ana Marinescu'],
['Conducător A','Andrei Popescu','Str. Lujerului 12, București','Permis: B-DEMO-8820412','Telefon: +40 721 000 101','Categoria B · valabil până la 11.04.2031'],
['Vehicul & RCA A','Dacia Logan · B 123 RMC','Allianz-Țiriac','Polița RCA-DEMO-A-26001','Valabilă 15.01.2026 - 14.01.2027','Avarie: colț dreapta față'],
['Conducător B','Mihai Ionescu','Bd. Timișoara 45, București','Permis: B-DEMO-900923','Telefon: +40 722 000 202','Categoria B · valabil până la 22.09.2032'],
['Vehicul & RCA B','Škoda Octavia · B 456 DEM','Groupama','Polița RCA-DEMO-B-26002','Valabilă 01.03.2026 - 28.02.2027','Avarie: colț stânga spate'],
['Împrejurări & schiță','A: circulă în același sens, pe altă bandă','B: schimbă banda spre stânga','Contact lateral minor','Schița GPS este confirmată','Fără recunoașterea vinovăției'],
['Semnături & PDF','Semnătura conducătorului A ✓','Semnătura conducătorului B ✓','RO-DEMO-001 finalizat','PDF + fotografii + JSON pregătite','Transmitere către asigurător']];
let i=0,timer=null;const steps=document.getElementById('steps'),screen=document.getElementById('screen');function render(){steps.innerHTML=data.map((x,n)=>`<div class="step ${n===i?'active':''}">${n+1}. ${x[0]}</div>`).join('');document.getElementById('bar').style.width=((i+1)/data.length*100)+'%';const x=data[i];screen.innerHTML=`<div class="label">Pasul ${i+1} / ${data.length}</div><h2>${x[0]}</h2><div class="row">${x.slice(1).map((v,n)=>`<div class="field"><div class="label">${['Date','Loc / document','Informație','Validare','Rezultat'][n]||'Date'}</div><div class="value" data-v="${v}"></div></div>`).join('')}</div>`;let els=[...screen.querySelectorAll('.value')];els.forEach((el,n)=>setTimeout(()=>type(el,el.dataset.v),120+n*210))}function type(el,s){let n=0;let q=setInterval(()=>{el.textContent=s.slice(0,++n);if(n>=s.length)clearInterval(q)},14)}function next(){i=Math.min(data.length-1,i+1);render()}function prev(){i=Math.max(0,i-1);render()}function play(){clearInterval(timer);i=0;render();timer=setInterval(()=>{if(i>=data.length-1)return clearInterval(timer);i++;render()},2600)}render();</script></body></html>
